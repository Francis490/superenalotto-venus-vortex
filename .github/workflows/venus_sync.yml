name: SuperEnalotto Venus Vortex Database Auto-Sync

on:
  schedule:
    # Esecuzione programmata: 20:35, 20:55, 21:35, 21:55 CEST nei giorni di estrazione
    - cron: '35,55 18,19 * * *'
  workflow_dispatch: # Permette l'avvio manuale (il pulsante "Run workflow")

jobs:
  update-venus-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso vitale per l'auto-commit della Dashboard e del Database

    steps:
      # 1. Checkout del codice (Aggiornato a v4 - Risolve il Node deprecation warning)
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup di Python (Aggiornato a v5 - Risolve il Node deprecation warning)
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Velocizza le run future memorizzando in cache le librerie

      # 3. Installazione delle Dipendenze Matematiche
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy scipy scikit-learn matplotlib

      # 4. Esecuzione del TITAN / GOD MODE V3
      - name: Execute TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      # 5. Auto-Commit (Salva il Database JSON e aggiorna la Dashboard HTML)
     - name: Commit and Push Changes
  run: |
    git config --local user.email "action@github.com"
    git config --local user.name "GitHub Action"
    git add .
    git diff-index --quiet HEAD || git commit -m "Auto-sync database e predizioni TITAN"
    git push
