name: TITAN Engine Automated Execution

on:
  schedule:
    # Martedì, Giovedì, Venerdì e Sabato alle 20:15 UTC.
    # In Italia: 22:15 con ora legale (CEST), 21:15 con ora solare (CET).
    - cron: '15 20 * * 2,4,5,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: titan-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-titan-engine:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy scipy

      - name: Esecuzione TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Salvataggio automatico del Database e Grafico su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in venus_database.json vortex_chart.png venus_history.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Auto-update TITAN engine results [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ==========================================
      # PREPARAZIONE SITO STATICO PER GITHUB PAGES
      # ==========================================
      - name: Preparazione cartella sito
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f vortex_chart.png ] && cp vortex_chart.png _site/vortex_chart.png || true
          [ -f venus_database.json ] && cp venus_database.json _site/venus_database.json || true
          # Disabilita Jekyll (evita che file con underscore vengano ignorati)
          touch _site/.nojekyll

      - name: Upload artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ==========================================
  # JOB DI DEPLOY SU GITHUB PAGES
  # ==========================================
  deploy-pages:
    needs: run-titan-engine
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
