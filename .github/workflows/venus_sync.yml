name: SuperEnalotto Venus Vortex Database Auto-Sync

on:
  schedule:
    # 20:00 UTC = 22:00 Italiane (CEST)
    # Esegue nei giorni di estrazione: Martedì (2), Giovedì (4), Venerdì (5), Sabato (6)
    - cron: '0 20 * * 2,4,5,6'
  workflow_dispatch: # Permette il lancio manuale da interfaccia GitHub

jobs:
  update-venus-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Concede i permessi necessari per il git push automatizzato

    env:
      # Forza l'orario italiano per datetime.now() dentro Python
      TZ: "Europe/Rome"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Velocizza la build riutilizzando i pacchetti già scaricati

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute TITAN Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync database e predizioni TITAN [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nessuna modifica rilevata nel database. Commit saltato."
          fi
