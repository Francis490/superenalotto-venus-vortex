name: SuperEnalotto Venus Vortex Database Auto-Sync

on:
  schedule:
    # 18:35, 18:55, 19:35, 19:55 UTC
    # - In Ora Legale (CEST): equivale a 20:35, 20:55, 21:35, 21:55
    # - In Ora Solare (CET): equivale a 19:35, 19:55, 20:35, 20:55
    - cron: '35,55 18,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-venus-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inizializza Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui Scraper e Notifica Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Commit e Push dei Database JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "cron(db): aggiornamento automatico estrazione Venus Vortex [skip ci]"
          file_pattern: "*.json"
          commit_user_name: "Venus Vortex Auto-Sync Bot"
          commit_user_email: "actions@github.com"
