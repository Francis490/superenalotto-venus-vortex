name: TITAN Engine Automated Execution

on:
  schedule:
    # Cron 1: estate (CEST = UTC+2) → 21:45 italiane
    - cron: '45 19 * * 2,4,5,6'
    # Cron 2: inverno (CET = UTC+1) → 21:45 italiane
    - cron: '45 20 * * 2,4,5,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: titan-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # Gatekeeper: verifica che sia l'ora italiana corretta
  # ==========================================
  check-time:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        name: Verifica orario italiano
        run: |
          # Se attivato manualmente (workflow_dispatch) → bypass check
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[*] Esecuzione manuale: skip check orario."
            exit 0
          fi

          # Ora italiana attuale
          HOUR_IT=$(TZ="Europe/Rome" date +%H)
          MIN_IT=$(TZ="Europe/Rome" date +%M)
          TOTAL_MIN=$((10#$HOUR_IT * 60 + 10#$MIN_IT))

          # Finestra target: 21:15 - 22:30 italiane
          # (tollerante per ritardi GitHub Actions, tipicamente 5-20 min)
          MIN_TARGET=$((21 * 60 + 15))
          MAX_TARGET=$((22 * 60 + 30))

          echo "[*] Ora italiana attuale: ${HOUR_IT}:${MIN_IT}"
          echo "[*] Finestra target: 21:15 - 22:30 italiane"

          if [ $TOTAL_MIN -ge $MIN_TARGET ] && [ $TOTAL_MIN -le $MAX_TARGET ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "[✓] Dentro la finestra. Procedo."
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "[✗] Fuori dalla finestra. Salto."
          fi

  # ==========================================
  # Job principale (parte solo se check-time passa)
  # ==========================================
  run-titan-engine:
    needs: check-time
    if: needs.check-time.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configurazione Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggiornamento estrazioni da fonte esterna
        run: python fetch_latest_draw.py
        continue-on-error: true

      - name: Esecuzione TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Generazione guida aggiornamento
        run: python generate_update_guide.py
        continue-on-error: true

      - name: Salvataggio automatico del Database e Grafico su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in venus_database.json vortex_chart.png vortex_heatmap.png vortex_distribution.png venus_history.json venus_jackpot.json venus_track_record.json UPDATE_HERE.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Auto-update TITAN engine results [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparazione cartella sito
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f analysis.html ]           && cp analysis.html _site/analysis.html || true
          [ -f manifest.json ]           && cp manifest.json _site/manifest.json || true
          [ -f sw.js ]                   && cp sw.js _site/sw.js || true
          [ -f icon-192.png ]            && cp icon-192.png _site/icon-192.png || true
          [ -f icon-512.png ]            && cp icon-512.png _site/icon-512.png || true
          [ -f favicon.ico ]             && cp favicon.ico _site/favicon.ico || true
          [ -f vortex_chart.png ]        && cp vortex_chart.png _site/vortex_chart.png || true
          [ -f vortex_heatmap.png ]      && cp vortex_heatmap.png _site/vortex_heatmap.png || true
          [ -f vortex_distribution.png ] && cp vortex_distribution.png _site/vortex_distribution.png || true
          [ -f venus_database.json ]     && cp venus_database.json _site/venus_database.json || true
          [ -f venus_history.json ]      && cp venus_history.json _site/venus_history.json || true
          touch _site/.nojekyll

      - name: Upload artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ==========================================
  # Deploy GitHub Pages (parte solo se run-titan-engine gira)
  # ==========================================
  deploy-pages:
    needs: run-titan-engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
