name: SuperEnalotto Venus Vortex Database Auto-Sync

on:
  schedule:
    # 21:00 UTC = 23:00 italiane (CEST)
    - cron: '0 21 * * *'
  workflow_dispatch: # Mantiene la possibilità di lanciarlo manualmente quando vuoi

jobs:
  update-venus-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # <--- AGGIUNTO: Concede i permessi di scrittura per fare il git push

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 numpy scipy matplotlib scikit-learn

      - name: Execute TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync database e predizioni TITAN [skip ci]"
            git push
          else
            echo "Nessuna modifica rilevata nel database. Commit saltato."
          fi
