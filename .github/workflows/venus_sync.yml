name: TITAN Engine Automated Execution

on:
  schedule:
    # Esegue automaticamente Martedì, Giovedì, Venerdì e Sabato alle 20:15 UTC (22:15 Ora Italiana)
    - cron: '15 20 * * 2,4,5,6'
  workflow_dispatch: # Mantiene un pulsante manuale di scorta

permissions:
  contents: write

jobs:
  run-titan-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy scipy

      - name: Esecuzione TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Salvataggio automatico del Database e Grafico su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add venus_database.json vortex_chart.png venus_history.json || true
          git commit -m "Auto-update TITAN engine results [skip ci]" || true
          git push
