name: Generate Manual PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert Markdown to PDF
        uses: baileyjm02/markdown-to-pdf@v1
        with:
          input_path: MANUALE_VENUS_VORTEX.md
          output_dir: .
          image_import: ./images
          build_html: false

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MANUALE_VENUS_VORTEX.pdf
          git diff --cached --quiet || git commit -m "docs: rigenera manuale PDF [skip ci]"
          git push

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuale-venus-vortex
          path: MANUALE_VENUS_VORTEX.pdf
