name: Generate Manual PDF

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown xhtml2pdf

      - name: Generate Manual PDF
        run: python generate_manual_pdf.py

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MANUALE_VENUS_VORTEX.pdf
          if git diff --cached --quiet; then
            echo "Nessuna modifica al PDF."
          else
            git commit -m "docs: rigenera manuale PDF [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuale-venus-vortex
          path: MANUALE_VENUS_VORTEX.pdf
