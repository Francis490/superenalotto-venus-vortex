name: Generate Manual PDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown xhtml2pdf

      - name: Generate Manual PDF
        run: python generate_manual_pdf.py

      - name: Commit and push PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MANUALE_VENUS_VORTEX.pdf
          git diff --cached --quiet || git commit -m "docs: rigenera manuale PDF [skip ci]"
          git push

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuale-venus-vortex
          path: MANUALE_VENUS_VORTEX.pdf
