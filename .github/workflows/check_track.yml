name: Check Track Record

on:
  workflow_dispatch:

jobs:
  check-track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Check
        run: python check_track_record.py
