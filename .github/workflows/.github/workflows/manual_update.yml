name: Manual Update

on:
  workflow_dispatch:
    inputs:
      concorso:
        description: 'N° concorso appena uscito (es. 150)'
        required: true
        type: string
      data:
        description: 'Data estrazione (es. 18/09/2026)'
        required: true
        type: string
      combinazione:
        description: 'Sestina vincente separata da virgole (es. "5,12,18,32,47,54")'
        required: true
        type: string
      jolly:
        description: 'Jolly (es. 21)'
        required: true
        type: string
      superstar:
        description: 'SuperStar (es. 51)'
        required: true
        type: string
      jackpot:
        description: 'Jackpot in euro senza simboli (es. 28800000)'
        required: true
        type: string
      sestine_giocate:
        description: 'Sestine giocate per il PROSSIMO concorso (opzionale)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: manual-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-update:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      MANUAL_CONCORSO: ${{ github.event.inputs.concorso }}
      MANUAL_DATA: ${{ github.event.inputs.data }}
      MANUAL_COMBINAZIONE: ${{ github.event.inputs.combinazione }}
      MANUAL_JOLLY: ${{ github.event.inputs.jolly }}
      MANUAL_SUPERSTAR: ${{ github.event.inputs.superstar }}
      MANUAL_JACKPOT: ${{ github.event.inputs.jackpot }}
      MANUAL_SESTINE: ${{ github.event.inputs.sestine_giocate }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aggiornamento manuale
        run: python manual_update.py

      - name: Esecuzione TITAN Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper.py

      - name: Salvataggio su GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          for file in venus_manual_override.json venus_played.json \
                      venus_database.json venus_history.json venus_jackpot.json \
                      venus_track_record.json vortex_chart.png \
                      vortex_heatmap.png vortex_distribution.png UPDATE_HERE.md; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Manual update: draw ${{ github.event.inputs.concorso }} [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Preparazione cartella sito
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          [ -f analysis.html ]           && cp analysis.html _site/analysis.html || true
          [ -f manifest.json ]           && cp manifest.json _site/manifest.json || true
          [ -f sw.js ]                   && cp sw.js _site/sw.js || true
          [ -f icon-192.png ]            && cp icon-192.png _site/icon-192.png || true
          [ -f icon-512.png ]            && cp icon-512.png _site/icon-512.png || true
          [ -f favicon.ico ]             && cp favicon.ico _site/favicon.ico || true
          [ -f vortex_chart.png ]        && cp vortex_chart.png _site/vortex_chart.png || true
          [ -f vortex_heatmap.png ]      && cp vortex_heatmap.png _site/vortex_heatmap.png || true
          [ -f vortex_distribution.png ] && cp vortex_distribution.png _site/vortex_distribution.png || true
          [ -f venus_database.json ]     && cp venus_database.json _site/venus_database.json || true
          [ -f venus_history.json ]      && cp venus_history.json _site/venus_history.json || true
          touch _site/.nojekyll

      - name: Upload artifact per GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: manual-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
