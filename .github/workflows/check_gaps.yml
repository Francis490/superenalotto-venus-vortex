name: Check History Gaps

on:
  workflow_dispatch:

jobs:
  check-gaps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Diagnostic
        run: python check_history_gaps.py
